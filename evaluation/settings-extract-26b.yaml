# The settings of evaluation/settings.yaml, with the model of gentrex select
# as the extraction model too. submit_pipeline.sh makes one run with this
# file, to show what the larger extraction model is worth. Gemma 4 26B-A4B
# fits on one GPU.

normalize:
  clinvar_path: data/clinvar/variant_summary_2026-11.txt.gz

extract:
  model: google/gemma-4-26B-A4B-it
