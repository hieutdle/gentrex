[project]
name = "gentrex"
version = "0.1.0"
description = "Gentrex (Genetic Test Report eXtraction): structured data from clinical genetics PDF reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hieu Le" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=1.40",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdfium2>=5.12.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.urls]
Repository = "https://github.com/hieutdle/gentrex"

[project.scripts]
gentrex = "gentrex.cli:main"

[project.optional-dependencies]
hpo = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
# Drivers for the database servers that stage 5 supports. SQLite needs none.
mysql = [
    "pymysql[rsa]>=1.1",
]
postgresql = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.6",
]
evaluation = [
    "scipy>=1.18.1",
]

# Stage 4 embeds on the CPU. On Linux, torch from PyPI brings several GB of
# CUDA libraries, so torch and torchvision come from PyTorch's CPU-only index
# instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gentrex"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
