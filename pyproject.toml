[project]
name = "gentrex"
version = "0.1.0"
description = "Gentrex (Genetic Test Report eXtraction): structured data from clinical genetics PDF reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hieu Le" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdfium2>=5.12.1",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/hieutdle/gentrex"

[project.scripts]
gentrex = "gentrex.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gentrex"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
